name: e2e-tests
run-name: "${{ inputs.retarget_run && format('Retarget E2E for PR #{0}', inputs.pr) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}"
on:
  workflow_dispatch:
    inputs:
      e2e_branch:
        description: Branch of synonymdev/bitkit-e2e-tests to use (main | default-feature-branch | custom branch name)
        required: false
        default: default-feature-branch
      pr:
        description: PR number to test as merged into master
        required: false
        default: ""
      merge_commit:
        description: Pinned PR merge commit for retarget validation
        default: ""
      head_sha:
        description: PR head verified by the retarget dispatcher
        default: ""
      app_branch:
        description: PR branch for selecting matching E2E coverage
        default: ""
      check_run_id:
        description: PR check owned by this retarget validation
        default: ""
      retarget_run:
        description: Retarget status owner (set by e2e-retarget.yml)
        default: ""
      workflow_ref:
        description: Workflow source recorded for this validation generation
        default: master
      helper_ref:
        description: Recovery helper branch or tag
        default: master
      selection:
        description: "auto: PR changes; base: five cases; full: all local/staging cases"
        type: choice
        options:
          - full
          - auto
          - base
        default: full
      shards:
        description: Manual local-shard cost experiment; automatic runs use one
        type: choice
        options:
          - "1"
          - "2"
        default: "1"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - master
  schedule:
    - cron: 0 3 * * *
env:
  TERM: xterm-256color
  FORCE_COLOR: 1
  GIT_LFS_SKIP_SMUDGE: "1"
concurrency:
  group: e2e-tests-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true
jobs:
  detect-changes:
    needs:
      - e2e-branch
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.selection.outputs.code }}
      matrix: ${{ steps.selection.outputs.matrix }}
      staging: ${{ steps.selection.outputs.staging }}
      appSha: ${{ steps.selection.outputs.appSha }}
      e2eSha: ${{ steps.selection.outputs.e2eSha }}
    steps:
      - name: Verify manual PR before checking out its code
        id: manual-pr
        if: github.event_name == 'workflow_dispatch' && inputs.pr != ''
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ inputs.pr }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
          EXPECTED_MERGE: ${{ inputs.merge_commit }}
        with:
          result-encoding: string
          script: |
            const n = process.env.PR_NUMBER;
            if (!/^[1-9][0-9]*$/.test(n)) throw new Error('Invalid PR number');
            const {owner, repo} = context.repo;
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: Number(n)});
            if (pr.state !== 'open' || pr.head.repo?.id !== context.payload.repository.id)
              throw new Error('Manual PR validation requires an open PR from this repository');
            if (!pr.merge_commit_sha || (process.env.EXPECTED_MERGE && process.env.EXPECTED_MERGE !== pr.merge_commit_sha) ||
                (process.env.EXPECTED_HEAD && process.env.EXPECTED_HEAD !== pr.head.sha))
              throw new Error('Manual PR merge or head changed');
            return pr.merge_commit_sha;
      - name: Checkout tested app
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.manual-pr.outputs.result || github.sha }}
          path: app-ci
          fetch-depth: 0
      - name: Resolve E2E tests ref
        id: e2e-ref
        uses: synonymdev/bitkit-e2e-tests/.github/actions/resolve-e2e-ref@main
        with:
          selected: ${{ needs.e2e-branch.outputs.branch }}
          e2e_branch_input: ${{ inputs.e2e_branch || 'default-feature-branch' }}
      - name: Checkout test selection
        uses: actions/checkout@v7
        with:
          repository: synonymdev/bitkit-e2e-tests
          ref: ${{ steps.e2e-ref.outputs.ref }}
          path: e2e-ci
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Select iOS gate and affected packs
        id: selection
        env:
          E2E_TEST_ROOT: ${{ format('{0}/e2e-ci', github.workspace) }}
          E2E_SELECTION: ${{ inputs.retarget_run != '' && 'auto' || inputs.selection || 'full' }}
          E2E_SHARDS: ${{ inputs.shards || '1' }}
          E2E_MANUAL_PR: ${{ inputs.pr }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node app-ci/.github/scripts/e2e-selection.cjs
      - name: Upload selection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-selection
          path: selection.json
          retention-days: 7
  build-local:
    needs: detect-changes
    cache-mode: read
    permissions:
      contents: read
      packages: read
      pull-requests: read
      checks: write
      actions: write
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect-changes.outputs.appSha }}
      - name: Checkout retarget reporter
        if: inputs.retarget_run != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: retarget-ci
          sparse-checkout: .github/scripts
      - name: Report retarget tests running
        if: inputs.retarget_run != ''
        uses: actions/github-script@v9
        env:
          RETARGET_CHECK_RUN_ID: ${{ inputs.check_run_id }}
          RETARGET_RUN: ${{ inputs.retarget_run }}
          RETARGET_HEAD_SHA: ${{ inputs.head_sha }}
          RETARGET_MERGE_COMMIT: ${{ inputs.merge_commit }}
          RETARGET_PR: ${{ inputs.pr }}
          RETARGET_HELPER_REF: ${{ inputs.helper_ref }}
        with:
          script: |
            const {reportRetargetResult} = require('./retarget-ci/.github/scripts/retarget-tests.cjs');
            await reportRetargetResult({github, context, core, name: 'e2e-status', phase: 'start'});
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"
      - name: System Information
        run: |
          echo "=== System Information ==="
          echo "macOS Version:"
          sw_vers
          echo ""
          echo "Xcode Version:"
          xcodebuild -version
      - name: Install xcbeautify
        run: |
          brew install xcbeautify
      - name: Swift packages
        uses: ./.github/actions/swift-packages
      - name: Pre-start simulator
        run: |
          echo "⏱️  Starting simulator at $(date)"
          xcrun simctl boot "iPhone 17" || true
          echo "✅ Simulator started at $(date)"
      - name: Build iOS app (local)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHATWOOT_API: ${{ secrets.CHATWOOT_API }}
          SIMULATOR_NAME: iPhone 17
          OS_VERSION: "26.2"
        run: |
          echo "=== Building iOS app (local) ==="
          echo "Using simulator: $SIMULATOR_NAME (iOS $OS_VERSION)"

          if xcodebuild -showsdks | grep -q "iOS Simulator"; then
            echo "✅ iOS Simulator platform already installed"
          else
            echo "⚙️  iOS Simulator platform not found — downloading..."
            xcodebuild -downloadPlatform iOS
          fi

          xcodebuild -workspace Bitkit.xcodeproj/project.xcworkspace \
            -scheme Bitkit \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME,OS=$OS_VERSION" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -disablePackageRepositoryCache \
            -disableAutomaticPackageResolution \
            -skipPackageUpdates \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG E2E_BUILD' \
            TREZOR_BRIDGE=true \
            TREZOR_BRIDGE_URL=http://127.0.0.1:21325 \
            -allowProvisioningUpdates \
            build
      - name: Prepare app for E2E tests (local)
        run: |
          # Copy the .app bundle to the expected location and name
          mkdir -p e2e-app
          cp -r DerivedData/Build/Products/Debug-iphonesimulator/Bitkit.app e2e-app/bitkit.app
      - name: Record app build identity
        env:
          BUILD_PLATFORM: ios
          BUILD_BACKEND: local
        run: |-
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          Path('e2e-app/e2e-build.json').write_text(json.dumps({'appSha': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), 'platform': os.environ['BUILD_PLATFORM'], 'backend': os.environ['BUILD_BACKEND']}))
          PY
      - name: Upload iOS app (local)
        uses: actions/upload-artifact@v7
        with:
          name: bitkit-e2e-ios_${{ github.run_number }}
          path: e2e-app/
          retention-days: 7
    timeout-minutes: 40
  e2e-branch:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: synonymdev/bitkit-e2e-tests/.github/workflows/determine-e2e-branch.yml@main
    with:
      app_branch: ${{ inputs.app_branch || github.head_ref || github.ref_name }}
      e2e_branch_input: ${{ github.event.inputs.e2e_branch || 'default-feature-branch' }}
  e2e-tests-local:
    cache-mode: read
    permissions:
      contents: read
      packages: read
      pull-requests: read
      checks: write
      actions: write
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: namespace-profile-mac
    needs:
      - detect-changes
      - build-local
      - e2e-branch
    env:
      SIMULATOR_NAME: iPhone 17
      SIMULATOR_OS_VERSION: "26.2"
      PLATFORM: ios
      BACKEND: local
      AUT_FILENAME: bitkit.app
      E2E_APP_SHA: ${{ needs.detect-changes.outputs.appSha }}
      E2E_RUN_ID: ${{ format('{0}-{1}-local-{2}', github.run_id, github.run_attempt, matrix.shard.name) }}
      E2E_PLAN: artifacts/reporting/plan.json
      E2E_BACKEND_REVISION: local-docker
      E2E_VARIANT: local-trezor
      E2E_CASE_IDS: ${{ toJSON(matrix.shard.ids) }}
      E2E_ATTEMPT_TIMEOUT_MINUTES: ${{ matrix.shard.attemptTimeoutMinutes }}
      NAMESPACE_STACK_DURATION: ${{ matrix.shard.backendLifetime }}
      RECORD_VIDEO: "true"
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
      max-parallel: 2
    name: e2e-tests-local - ${{ matrix.shard.name }}
    steps:
      - name: Checkout stack scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect-changes.outputs.appSha }}
          sparse-checkout: .github/scripts
      - name: Checkout retarget reporter
        if: inputs.retarget_run != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: retarget-ci
          sparse-checkout: .github/scripts
      - name: Report retarget tests running
        if: inputs.retarget_run != ''
        uses: actions/github-script@v9
        env:
          RETARGET_CHECK_RUN_ID: ${{ inputs.check_run_id }}
          RETARGET_RUN: ${{ inputs.retarget_run }}
          RETARGET_HEAD_SHA: ${{ inputs.head_sha }}
          RETARGET_MERGE_COMMIT: ${{ inputs.merge_commit }}
          RETARGET_PR: ${{ inputs.pr }}
          RETARGET_HELPER_REF: ${{ inputs.helper_ref }}
        with:
          script: |
            const {reportRetargetResult} = require('./retarget-ci/.github/scripts/retarget-tests.cjs');
            await reportRetargetResult({github, context, core, name: 'e2e-status', phase: 'start'});
      - name: Clone E2E tests
        uses: actions/checkout@v7
        with:
          repository: synonymdev/bitkit-e2e-tests
          path: bitkit-e2e-tests
          ref: ${{ needs.detect-changes.outputs.e2eSha }}
      - name: Download iOS app
        uses: actions/download-artifact@v8
        with:
          name: bitkit-e2e-ios_${{ github.run_number }}
          path: bitkit-e2e-tests/aut
      - name: List iOS app directory contents
        run: ls -l bitkit-e2e-tests/aut
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cache npm cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        working-directory: bitkit-e2e-tests
        run: npm ci
      - name: Run regtest setup
        run: |
          .github/scripts/namespace-stack.sh up bitkit-e2e-tests/docker
          (cd bitkit-e2e-tests/docker && docker compose up --force-recreate -d)
          .github/scripts/namespace-stack.sh forward 43782 39388 60001 8080 9735 10009 3003 9001 9002 21325 21328
      - name: Wait for electrum server
        run: |
          for _ in $(seq 1 60); do
            python3 -c 'import socket; s = socket.create_connection(("127.0.0.1", 60001), 10); s.sendall(b"{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"blockchain.headers.subscribe\",\"params\":[]}\n"); assert b"height" in s.recv(4096)' && exit 0
            sleep 5
          done
          exit 1
      - name: Copy LND credentials
        working-directory: bitkit-e2e-tests/docker
        run: |
          mkdir -p lnd/data/chain/bitcoin/regtest
          for _ in $(seq 1 60); do
            docker cp lnd:/home/lnd/.lnd/data/chain/bitcoin/regtest/admin.macaroon lnd/data/chain/bitcoin/regtest/ 2>/dev/null && break
            sleep 5
          done
          docker cp lnd:/home/lnd/.lnd/tls.cert lnd/tls.cert
          test -s lnd/data/chain/bitcoin/regtest/admin.macaroon
      - name: Clear previous E2E artifacts
        working-directory: bitkit-e2e-tests
        run: |
          rm -rf artifacts/
          rm -rf /tmp/lock/
      - name: Clear iOS Simulator environment
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-" + os.environ["SIMULATOR_OS_VERSION"].replace(".", "-")
          devices = json.load(sys.stdin)["devices"].get(runtime, [])
          print(next(d["udid"] for d in devices if d["name"] == os.environ["SIMULATOR_NAME"]))
          ')
          xcrun simctl shutdown all || true
          xcrun simctl erase "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          defaults write com.apple.iphonesimulator DisableAllNotifications -bool true
      - name: Prepare exact run plan
        working-directory: bitkit-e2e-tests
        run: node --experimental-strip-types scripts/ci-run.ts prepare
      - name: Run selected tests (up to three attempts)
        id: tests
        working-directory: bitkit-e2e-tests
        run: node --experimental-strip-types scripts/ci-run.ts run
        env:
          RECORD_VIDEO: "true"
      - name: Report all attempts
        if: always()
        working-directory: bitkit-e2e-tests
        run: node --experimental-strip-types scripts/ci-run.ts report
      - name: Upload E2E Artifacts (${{ matrix.shard.name }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts_${{ matrix.shard.name }}_${{ github.run_number }}
          path: bitkit-e2e-tests/artifacts/
          retention-days: 7
      - name: Tear down regtest stack
        if: always()
        run: .github/scripts/namespace-stack.sh down
    timeout-minutes: ${{ matrix.shard.jobTimeoutMinutes }}
  e2e-status:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: e2e-status
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-local
      - e2e-tests-local
      - staging
      - build-network
    steps:
      - name: Require all selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |-
          python3 - <<'PY'
          import json, os
          j=json.loads(os.environ['RESULTS'])
          assert j['detect-changes']['result']=='success', 'Selection did not succeed'
          s=j['detect-changes']['outputs']
          required=['build-local','e2e-tests-local'] if s['code']=='true' else []
          if s['staging']=='true': required += ['build-network', 'staging']
          failed={k:j[k]['result'] for k in required if j[k]['result']!='success'}
          assert not failed, f'Selected jobs did not pass: {failed}'
          print('All selected E2E jobs passed' if required else 'No app code changes')
          PY
  report-retarget-result:
    name: Report retarget E2E result
    if: always() && inputs.retarget_run != ''
    needs:
      - detect-changes
      - build-local
      - e2e-branch
      - e2e-tests-local
      - e2e-status
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: retarget-ci
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v9
        env:
          RETARGET_CHECK_RUN_ID: ${{ inputs.check_run_id }}
          RETARGET_RUN: ${{ inputs.retarget_run }}
          RETARGET_HEAD_SHA: ${{ inputs.head_sha }}
          RETARGET_MERGE_COMMIT: ${{ inputs.merge_commit }}
          RETARGET_PR: ${{ inputs.pr }}
          RETARGET_HELPER_REF: ${{ inputs.helper_ref }}
          TEST_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const {reportRetargetResult, e2eRetargetResult} = require('./retarget-ci/.github/scripts/retarget-tests.cjs');
            const result = e2eRetargetResult(JSON.parse(process.env.TEST_RESULTS));
            await reportRetargetResult({github, context, core, name: 'e2e-status', phase: 'complete', result});
  staging:
    needs:
      - detect-changes
      - build-network
    if: needs.detect-changes.outputs.staging == 'true'
    uses: ./.github/workflows/e2e-staging.yml
    with:
      app_ref: ${{ needs.detect-changes.outputs.appSha }}
      e2e_ref: ${{ needs.detect-changes.outputs.e2eSha }}
      app_artifact: bitkit-e2e-ios-network_${{ github.run_number }}
      post_to_slack: ${{ github.event_name == 'schedule' }}
    secrets: inherit
  build-network:
    env:
      SIMULATOR_NAME: iPhone 17
      IOS_VERSION: "26.2"
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect-changes.outputs.appSha }}
      - name: Record selected revision
        id: app
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"
      - name: System Information
        run: |
          echo "=== System Information ==="
          echo "macOS Version:"
          sw_vers
          echo ""
          echo "Xcode Version:"
          xcodebuild -version
      - name: Install xcbeautify
        run: |
          brew install xcbeautify
      - name: Swift packages
        uses: ./.github/actions/swift-packages
      - name: Pre-start simulator
        run: |
          echo "⏱️  Starting simulator at $(date)"
          xcrun simctl boot "${{ env.SIMULATOR_NAME }}" || true
          echo "✅ Simulator started at $(date)"
      - name: Build iOS app (regtest)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_BACKEND: network
          E2E_NETWORK: regtest
        run: |
          echo "=== Building iOS app (regtest) ==="
          echo "Using simulator: ${{ env.SIMULATOR_NAME }} (iOS ${{ env.IOS_VERSION }})"

          if xcodebuild -showsdks | grep -q "iOS Simulator"; then
            echo "✅ iOS Simulator platform already installed"
          else
            echo "⚙️  iOS Simulator platform not found — downloading..."
            xcodebuild -downloadPlatform iOS
          fi

          xcodebuild -workspace Bitkit.xcodeproj/project.xcworkspace \
            -scheme Bitkit \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ env.SIMULATOR_NAME }},OS=${{ env.IOS_VERSION }}" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -disablePackageRepositoryCache \
            -disableAutomaticPackageResolution \
            -skipPackageUpdates \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG E2E_BUILD' \
            -allowProvisioningUpdates \
            build
      - name: Prepare app for E2E tests (regtest)
        run: |
          mkdir -p e2e-app
          cp -r DerivedData/Build/Products/Debug-iphonesimulator/Bitkit.app e2e-app/bitkit.app
      - name: Record app build identity
        env:
          BUILD_PLATFORM: ios
          BUILD_BACKEND: regtest
        run: |-
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          Path('e2e-app/e2e-build.json').write_text(json.dumps({'appSha': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), 'platform': os.environ['BUILD_PLATFORM'], 'backend': os.environ['BUILD_BACKEND']}))
          PY
      - name: Upload iOS app (regtest)
        uses: actions/upload-artifact@v7
        with:
          name: bitkit-e2e-ios-network_${{ github.run_number }}
          path: e2e-app/
          retention-days: 7
    timeout-minutes: 40
    outputs:
      appSha: ${{ steps.app.outputs.sha }}
    needs:
      - detect-changes
    if: needs.detect-changes.outputs.staging == 'true'
