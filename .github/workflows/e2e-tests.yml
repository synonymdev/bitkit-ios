name: macmini1 WebDriverAgent smoke test
on:
  workflow_dispatch:
    inputs:
      run_appium_smoke:
        description: Run the single Appium session after collecting diagnostics
        type: boolean
        default: false
      simulator:
        description: Simulator model for the Appium session
        type: choice
        default: iPhone 17 Pro
        options:
          - iPhone 17 Pro
          - iPhone 17
permissions: {}
jobs:
  inventory:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - name: List installed runtimes and iPhone 17 simulators
        shell: bash
        run: |
          test "$RUNNER_NAME" = macmini1
          sw_vers
          xcodebuild -version
          python3 -B -u - <<'PY'
          import json
          from pathlib import Path
          import plistlib
          import subprocess

          for bundle in sorted(Path('/Applications').glob('Xcode*.app')):
              info = bundle / 'Contents/Info.plist'
              if info.is_file():
                  with info.open('rb') as file:
                      print(bundle.name, plistlib.load(file).get('CFBundleShortVersionString', 'unknown'))

          def simctl_json(resource):
              return json.loads(subprocess.check_output(
                  ['xcrun', 'simctl', 'list', '-j', resource], text=True, timeout=30,
              ))

          runtimes = simctl_json('runtimes')['runtimes']
          print('iOS runtimes:')
          for runtime in runtimes:
              if runtime['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-'):
                  print(runtime['identifier'], 'version=' + runtime['version'], 'build=' + runtime['buildversion'],
                        'available=' + str(runtime['isAvailable']))

          devices = simctl_json('devices')['devices']
          print('iPhone 17 devices visible to the runner account:')
          count = 0
          for runtime, entries in devices.items():
              for device in entries:
                  if 'iPhone 17' not in device['name']:
                      continue
                  print(runtime, device['name'], device['state'], 'available=' + str(device['isAvailable']))
                  count += 1
          if not count:
              print('None')
          PY
      - name: Read WebDriverAgent results from the failed PR job
        shell: bash
        run: |
          test "$RUNNER_NAME" = macmini1
          df -h /System/Volumes/Data
          xcode-select -p
          python3 -B -u - <<'PY'
          from datetime import datetime
          import json
          from pathlib import Path
          import subprocess

          start = datetime.fromisoformat('2026-11-23T11:24:00+00:00').timestamp()
          end = datetime.fromisoformat('2026-11-23T11:44:00+00:00').timestamp()
          roots = (
              Path.home() / 'Library/Developer/Xcode/DerivedData',
              Path.home() / 'Library/Developer/CoreSimulator/Devices/49F264CE-5A7C-4CF9-B1E5-A83C06AF670B/data/Library/Logs/DiagnosticReports',
          )
          results = roots[0].glob('WebDriverAgent-*/Logs/Test/*.xcresult')
          results = [path for path in results if not path.is_symlink() and start <= path.stat().st_mtime <= end]
          if not results:
              print('No WebDriverAgent result bundles retained for this time window.')
          for path in sorted(results, key=lambda item: item.stat().st_mtime):
              print(path.name)
              result = subprocess.run(
                  ['xcrun', 'xcresulttool', 'get', 'test-results', 'summary', '--path', str(path)],
                  text=True, capture_output=True, timeout=30,
              )
              if result.returncode:
                  print(result.stderr.strip()[:1200])
                  continue
              summary = json.loads(result.stdout)
              for field in ('result', 'failedTests', 'testFailures'):
                  if field in summary:
                      print(field, json.dumps(summary[field])[:6000])

          for directory in (roots[1], Path.home() / 'Library/Logs/DiagnosticReports'):
              for crash in sorted(directory.glob('WebDriverAgent*.ips')):
                  if not crash.is_symlink() and start <= crash.stat().st_mtime <= end:
                      print('WebDriverAgent crash report:', crash.name)
          PY
      - uses: actions/setup-node@v7
        if: inputs.run_appium_smoke
        with:
          node-version: 22
      - name: Start one verbose Appium session on iOS 27.2
        if: inputs.run_appium_smoke
        shell: bash
        env:
          SMOKE_DEVICE: ${{ inputs.simulator }}
        working-directory: bitkit-e2e-tests
        run: |
          test "$RUNNER_NAME" = macmini1
          xcodebuild -version | grep -Eq '^Xcode 27\.2([.]|$)'
          test "$(git rev-parse HEAD)" = bed683b581721716e6f870594c414288cbace935
          test -x node_modules/.bin/appium
          python3 -B -u - <<'PY'
          import json
          import os
          from pathlib import Path
          import socket
          import subprocess
          import tempfile
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          device_name = os.environ['SMOKE_DEVICE']
          platform_version = '27.2'
          inventory = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', '-j'], text=True, timeout=30,
          ))
          devices = [
              device
              for runtime in inventory['runtimes']
              if runtime['isAvailable'] and runtime['version'] == platform_version
              and runtime['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-')
              for device in inventory['devices'].get(runtime['identifier'], [])
              if device['isAvailable'] and device['name'] == device_name
          ]
          if not devices:
              raise SystemExit(f'No available {device_name} on iOS {platform_version}.')
          device = next((device for device in devices if device['state'] == 'Booted'), devices[0])
          udid = device['udid']
          print(f'Using {device_name} ({udid}) on iOS {platform_version}.')

          appium_port = 14723
          wda_port = 8100
          for port in (appium_port, wda_port):
              with socket.socket() as probe:
                  probe.settimeout(2)
                  if probe.connect_ex(('127.0.0.1', port)) == 0:
                      raise SystemExit(f'Port {port} is already listening.')

          subprocess.run(['xcrun', 'simctl', 'bootstatus', udid, '-b'], check=True, timeout=90)
          base = f'http://127.0.0.1:{appium_port}'
          with tempfile.TemporaryDirectory(prefix='wda-1371-') as work:
              server = subprocess.Popen(['node_modules/.bin/appium', '--address', '127.0.0.1',
                                         '--port', str(appium_port), '--log-level', 'info', '--log-no-colors'])
              try:
                  for _ in range(30):
                      if server.poll() is not None:
                          raise SystemExit(f'Appium exited before startup: {server.returncode}')
                      try:
                          with urlopen(base + '/status', timeout=2):
                              break
                      except URLError:
                          time.sleep(1)
                  else:
                      raise SystemExit('Appium server did not start.')

                  capabilities = {
                      'platformName': 'iOS',
                      'appium:automationName': 'XCUITest',
                      'appium:udid': udid,
                      'appium:deviceName': device_name,
                      'appium:platformVersion': platform_version,
                      'appium:bundleId': 'com.apple.Preferences',
                      'appium:noReset': True,
                      'appium:showXcodeLog': True,
                      'appium:derivedDataPath': str(Path(work) / 'DerivedData'),
                      'appium:wdaLocalPort': wda_port,
                      'appium:wdaLaunchTimeout': 240000,
                      'appium:wdaConnectionTimeout': 30000,
                      'appium:wdaStartupRetries': 1,
                  }
                  body = json.dumps({'capabilities': {'alwaysMatch': capabilities}}).encode()
                  request = Request(base + '/session', data=body, headers={'Content-Type': 'application/json'})
                  try:
                      with urlopen(request, timeout=360) as response:
                          session_id = json.load(response)['value']['sessionId']
                  except HTTPError as error:
                      print(error.read().decode(errors='replace')[:6000])
                      raise SystemExit(f'Appium session failed with HTTP {error.code}.')
                  print('WebDriverAgent and the Appium session are ready.')
                  with urlopen(Request(base + '/session/' + session_id, method='DELETE'), timeout=30):
                      pass
              finally:
                  server.terminate()
                  try:
                      server.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      server.kill()
                      server.wait()
          PY
