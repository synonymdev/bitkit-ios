name: Start Docker Desktop on the Spark Mac

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-docker:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - name: Start Docker Desktop for the runner account
        run: |
          test "$RUNNER_NAME" = macmini1
          python3 -u - <<'PY'
          import os
          import pathlib
          import subprocess
          import time

          docker_info = ['docker', 'info', '--format', '{{.ServerVersion}} {{.OSType}}/{{.Architecture}}']
          context = subprocess.check_output(['docker', 'context', 'show'], text=True, timeout=10).strip()
          if context != 'desktop-linux':
              raise SystemExit(f'Expected local Docker Desktop context, found {context!r}.')

          workers = subprocess.check_output(['ps', '-axo', 'comm='], text=True, timeout=10).splitlines()
          if sum(pathlib.Path(worker.strip()).name == 'Runner.Worker' for worker in workers) != 1:
              raise SystemExit('Expected only the current Actions worker.')

          try:
              already_healthy = subprocess.run(docker_info, timeout=8, check=False).returncode == 0
          except subprocess.TimeoutExpired:
              already_healthy = False
          if already_healthy:
              raise SystemExit(0)

          # Start the existing host service with only the account environment.
          # Docker Desktop should outlive this maintenance job.
          host_environment = {
              name: os.environ[name]
              for name in ('HOME', 'USER', 'LOGNAME', 'PATH', 'TMPDIR')
              if name in os.environ
          }
          subprocess.run(['docker', 'desktop', 'start', '--timeout', '75'],
                         check=True, env=host_environment, timeout=90)
          deadline = time.monotonic() + 60
          while time.monotonic() < deadline:
              try:
                  subprocess.run(docker_info, check=True, timeout=8)
                  break
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                  time.sleep(3)
          else:
              raise SystemExit('Docker Engine did not come up.')
          PY

  verify-docker:
    needs: start-docker
    runs-on: [self-hosted, macOS]
    timeout-minutes: 2
    steps:
      - name: Verify Docker survived maintenance job cleanup
        run: |
          test "$RUNNER_NAME" = macmini1
          python3 -u - <<'PY'
          import subprocess
          subprocess.run(['docker', 'info', '--format', '{{.ServerVersion}} {{.OSType}}/{{.Architecture}}'],
                         check=True, timeout=10)
          subprocess.run(['docker', 'ps', '--format', '{{.Names}}'], check=True, timeout=10)
          subprocess.run(['df', '-h', '/System/Volumes/Data'], check=True, timeout=10)
          PY
