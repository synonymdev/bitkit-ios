name: e2e-tests
run-name: Four-case iOS diagnostics on the original app artifact
on:
  workflow_dispatch:
    inputs:
      e2e_branch:
        description: Exact diagnostics E2E commit SHA
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-four-case-diagnostics-${{ github.ref }}
  cancel-in-progress: false
env:
  TERM: xterm-256color
  FORCE_COLOR: 1
  GIT_LFS_SKIP_SMUDGE: "1"
jobs:
  diagnostics:
    runs-on: namespace-profile-mac
    timeout-minutes: 150
    env:
      SIMULATOR_NAME: iPhone 17
      SIMULATOR_OS_VERSION: "26.5"
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/checkout@v7
        with:
          repository: synonymdev/bitkit-e2e-tests
          ref: ${{ inputs.e2e_branch }}
          path: bitkit-e2e-tests
      - name: Verify exact inputs
        env:
          EXPECTED_E2E: ${{ inputs.e2e_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$EXPECTED_E2E" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C bitkit-e2e-tests rev-parse HEAD)" = "$EXPECTED_E2E"
          gh api repos/synonymdev/bitkit-ios/actions/artifacts/13763346131 > app-artifact.json
          python3 - <<'PYTHON'
          import json
          a = json.load(open('app-artifact.json'))
          assert a['id'] == 13763346131 and not a['expired']
          assert a['name'] == 'bitkit-e2e-ios_4187'
          assert a['workflow_run']['id'] == 42808207298
          assert a['digest'] == 'sha256:bceca9d5c238e1faf89066553e0050f1df8f921a23f7d26f1c6516cad91db73d'
          print('Original app artifact and digest verified; built from e0998076e49b0b4923ebdd55a69eb76344d0382f')
          PYTHON
      - uses: actions/download-artifact@v8
        with:
          name: bitkit-e2e-ios_4187
          run-id: 42808207298
          github-token: ${{ github.token }}
          path: bitkit-e2e-tests/aut
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: bitkit-e2e-tests
        run: npm ci
      - name: Start original backend stack
        run: |
          .github/scripts/namespace-stack.sh up bitkit-e2e-tests/docker
          (cd bitkit-e2e-tests/docker && docker compose up --force-recreate -d)
          .github/scripts/namespace-stack.sh forward 43782 39388 60001 8080 9735 10009 3003 9001 9002 21325 21328
      - name: Wait for Electrum
        run: |
          for _ in $(seq 1 60); do
            python3 -c 'import socket; s = socket.create_connection(("127.0.0.1", 60001), 10); s.sendall(b"{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"blockchain.headers.subscribe\",\"params\":[]}\n"); assert b"height" in s.recv(4096)' && exit 0
            sleep 5
          done
          exit 1
      - name: Copy LND credentials
        working-directory: bitkit-e2e-tests/docker
        run: |
          mkdir -p lnd/data/chain/bitcoin/regtest
          for _ in $(seq 1 60); do
            docker cp lnd:/home/lnd/.lnd/data/chain/bitcoin/regtest/admin.macaroon lnd/data/chain/bitcoin/regtest/ 2>/dev/null && break
            sleep 5
          done
          docker cp lnd:/home/lnd/.lnd/tls.cert lnd/tls.cert
          test -s lnd/data/chain/bitcoin/regtest/admin.macaroon
      - name: Reset simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-" + os.environ["SIMULATOR_OS_VERSION"].replace(".", "-")
          devices = json.load(sys.stdin)["devices"].get(runtime, [])
          print(next(d["udid"] for d in devices if d["name"] == os.environ["SIMULATOR_NAME"]))
          ')
          xcrun simctl shutdown all || true
          xcrun simctl erase "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          defaults write com.apple.iphonesimulator DisableAllNotifications -bool true
          rm -rf /tmp/lock/
      - name: Validate failed-hook and failed-body diagnostics
        working-directory: bitkit-e2e-tests
        env:
          RECORD_VIDEO: true
          ATTEMPT: probe
        run: |
          set +e
          ./ci_run_ios.sh --spec ./test/diagnostics/probe.e2e.ts
          status=$?
          set -e
          test "$status" -ne 0
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          root = Path('artifacts/attempt-probe')
          for kind, error in [('setup', 'INTENTIONAL_DIAGNOSTICS_SETUP_FAILURE'), ('body', 'INTENTIONAL_DIAGNOSTICS_BODY_FAILURE')]:
              matches = [p for p in root.glob('*/failure/failure.json') if error in p.read_text()]
              assert len(matches) == 1, (kind, matches)
              failure = matches[0].parent
              for name in ['screen.png', 'source.xml', '../recording.mp4']:
                  assert (failure / name).stat().st_size > 0, (kind, name)
              manifest = json.loads((failure / 'native-manifest.json').read_text())
              assert manifest['appLogs'], (kind, manifest)
              assert any(p.get('exitCode') == 0 and p.get('file') == 'lnd-state.json' for p in manifest['probes'])
              assert (failure / 'forward-10009.log').is_file()
              print('Verified collector:', kind, failure)
          PYTHON
          rm -rf /tmp/lock/
      - name: Four cases - attempt 1
        id: first
        continue-on-error: true
        working-directory: bitkit-e2e-tests
        env:
          RECORD_VIDEO: true
          SAVE_DIAGNOSTICS: true
          ATTEMPT: 1
        run: ./ci_run_ios.sh --mochaOpts.grep '@boost_2|@multi_address_3|@send_2|@send_3'
      - name: Four cases - failed-only retry
        if: steps.first.outcome == 'failure'
        working-directory: bitkit-e2e-tests
        env:
          RECORD_VIDEO: true
          SAVE_DIAGNOSTICS: true
          ATTEMPT: 2
        run: ./ci_run_ios.sh --mochaOpts.grep '@boost_2|@multi_address_3|@send_2|@send_3'
      - name: Retain all attempt evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-four-case-diagnostics-${{ github.run_id }}
          path: |
            bitkit-e2e-tests/artifacts/
            app-artifact.json
          retention-days: 7
      - name: Tear down backend
        if: always()
        run: .github/scripts/namespace-stack.sh down
