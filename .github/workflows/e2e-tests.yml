name: e2e-tests
run-name: >-
  ${{ inputs.hosted_two_shard && 'Hosted iOS two-shard pilot' || inputs.retarget_run && format('Retarget E2E for PR #{0}', inputs.pr) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      hosted_two_shard:
        description: "Run the hosted Mac and Ubuntu pilot on this branch"
        type: boolean
        default: false
      e2e_branch:
        description: "Branch of synonymdev/bitkit-e2e-tests to use (main | default-feature-branch | custom branch name)"
        required: false
        default: "default-feature-branch"
      pr:
        description: "PR number to test as merged into master"
        required: false
        default: ""
      merge_commit:
        description: "Pinned PR merge commit for retarget validation"
        default: ""
      head_sha:
        description: "PR head verified by the retarget dispatcher"
        default: ""
      app_branch:
        description: "PR branch for selecting matching E2E coverage"
        default: ""
      check_run_id:
        description: "PR check owned by this retarget validation"
        default: ""
      retarget_run:
        description: "Retarget status owner (set by e2e-retarget.yml)"
        default: ""
      workflow_ref:
        description: "Workflow source recorded for this validation generation"
        default: master
      helper_ref:
        description: "Recovery helper branch or tag"
        default: master
  # PRs stacked on another branch run no E2E until they target master; e2e-retarget.yml starts it on retarget
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]

env:
  TERM: xterm-256color
  FORCE_COLOR: 1
  GIT_LFS_SKIP_SMUDGE: "1"
  PILOT_HARNESS_SHA: 13b5308a629f9e2cf640ad742d334a4a247df5ea

concurrency:
  group: e2e-tests-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      code: ${{ (github.event_name == 'workflow_dispatch' && !inputs.pr) || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.merge_commit || (inputs.pr && format('refs/pull/{0}/merge', inputs.pr)) || '' }}
          fetch-depth: 2
      - name: Resolve tested PR merge commits
        if: inputs.pr != ''
        id: merge-base
        run: |
          echo "base=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        # Retarget filters the exact tested merge against its first parent.
        if: github.event_name == 'pull_request' || inputs.pr
        id: filter
        with:
          base: ${{ steps.merge-base.outputs.base || 'master' }}
          ref: ${{ steps.merge-base.outputs.head || '' }}
          filters: |
            code:
              - 'Bitkit/**'
              - 'BitkitNotification/**'
              - 'Bitkit.xcodeproj/**'
              - 'Package.swift'
              - '.github/workflows/e2e-tests.yml'
              - '.github/scripts/**'
      - name: Confirm both pilot pairs before starting the shared build
        if: inputs.hosted_two_shard
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: "1"
        run: python3 .github/scripts/hosted-e2e-pair.py barrier

  build-local:
    needs: detect-changes
    # PR code must not publish dependency caches into the dispatch ref's scope.
    cache-mode: read
    permissions:
      contents: read
      packages: read
      pull-requests: read
      checks: write
      actions: write
    if: github.event.pull_request.draft == false && needs.detect-changes.outputs.code == 'true'
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.merge_commit || (inputs.pr && format('refs/pull/{0}/merge', inputs.pr)) || '' }}

      - name: Checkout retarget reporter
        if: inputs.retarget_run != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: retarget-ci
          sparse-checkout: .github/scripts
      - name: Report retarget tests running
        if: inputs.retarget_run != ''
        uses: actions/github-script@v9
        env:
          RETARGET_CHECK_RUN_ID: ${{ inputs.check_run_id }}
          RETARGET_RUN: ${{ inputs.retarget_run }}
          RETARGET_HEAD_SHA: ${{ inputs.head_sha }}
          RETARGET_MERGE_COMMIT: ${{ inputs.merge_commit }}
          RETARGET_PR: ${{ inputs.pr }}
          RETARGET_HELPER_REF: ${{ inputs.helper_ref }}
        with:
          script: |
            const {reportRetargetResult} = require('./retarget-ci/.github/scripts/retarget-tests.cjs');
            await reportRetargetResult({github, context, core, name: 'e2e-status', phase: 'start'});

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: System Information
        run: |
          echo "=== System Information ==="
          echo "macOS Version:"
          sw_vers
          echo ""
          echo "Xcode Version:"
          xcodebuild -version

      - name: Verify current PR merge checkout
        if: github.event_name == 'pull_request' || inputs.pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          tested=$(git rev-parse HEAD)
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq 'select(.base.ref == "master") | .head.sha')
          base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          expected="$base $head"
          actual=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tested" --jq '[.parents[].sha] | join(" ")')
          if [[ ! "$expected" =~ ^[0-9a-f]{40}\ [0-9a-f]{40}$ || "$actual" != "$expected" ]]; then
            echo "::error::Checked-out merge does not match the PR's current base and head"
            exit 1
          fi

      - name: Install xcbeautify
        run: |
          brew install xcbeautify

      - name: Swift packages
        uses: ./.github/actions/swift-packages

      - name: Pre-start simulator
        run: |
          echo "⏱️  Starting simulator at $(date)"
          xcrun simctl boot "iPhone 17" || true
          echo "✅ Simulator started at $(date)"

      - name: Build iOS app (local)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHATWOOT_API: ${{ secrets.CHATWOOT_API }}
          SIMULATOR_NAME: "iPhone 17"
          OS_VERSION: "26.5"
        run: |
          echo "=== Building iOS app (local) ==="
          echo "Using simulator: $SIMULATOR_NAME (iOS $OS_VERSION)"

          if xcodebuild -showsdks | grep -q "iOS Simulator"; then
            echo "✅ iOS Simulator platform already installed"
          else
            echo "⚙️  iOS Simulator platform not found — downloading..."
            xcodebuild -downloadPlatform iOS
          fi

          xcodebuild -workspace Bitkit.xcodeproj/project.xcworkspace \
            -scheme Bitkit \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME,OS=$OS_VERSION" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -disablePackageRepositoryCache \
            -disableAutomaticPackageResolution \
            -skipPackageUpdates \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG E2E_BUILD' \
            TREZOR_BRIDGE=true \
            TREZOR_BRIDGE_URL=http://127.0.0.1:21325 \
            -allowProvisioningUpdates \
            build

      - name: Prepare app for E2E tests (local)
        run: |
          # Copy the .app bundle to the expected location and name
          mkdir -p e2e-app
          cp -r DerivedData/Build/Products/Debug-iphonesimulator/Bitkit.app e2e-app/bitkit.app

      - name: Upload iOS app (local)
        uses: actions/upload-artifact@v7
        with:
          name: bitkit-e2e-ios_${{ github.run_number }}
          path: e2e-app/

  e2e-branch:
    needs: detect-changes
    if: "!inputs.hosted_two_shard && github.event.pull_request.draft == false && needs.detect-changes.outputs.code == 'true'"
    uses: synonymdev/bitkit-e2e-tests/.github/workflows/determine-e2e-branch.yml@main
    with:
      app_branch: ${{ inputs.app_branch || github.head_ref || github.ref_name }}
      e2e_branch_input: ${{ github.event.inputs.e2e_branch || 'default-feature-branch' }}

  e2e-tests-local:
    cache-mode: read
    permissions:
      contents: read
      packages: read
      pull-requests: read
      checks: write
      actions: write
    if: "!inputs.hosted_two_shard && github.event.pull_request.draft == false && needs.detect-changes.outputs.code == 'true'"
    runs-on: [self-hosted, macOS]
    needs: [detect-changes, build-local, e2e-branch]
    env:
      # Reuse the legacy project so reset also clears containers left after a ref switch.
      COMPOSE_PROJECT_NAME: docker
      # Match the legacy fixture for the iOS manual channel funding Max case.
      BITCOIN_FALLBACK_FEE: "0.00001"

    strategy:
      fail-fast: false
      matrix:
        shard:
          # - { name: onboarding_backup_numberpad, grep: "@onboarding|@backup|@numberpad" }
          # - { name: onchain_boost_receive_widgets, grep: "@onchain|@boost|@receive|@widgets" }
          # - { name: settings, grep: "@settings" }
          # - { name: security, grep: "@security" }
          - { name: e2e, grep: '@ios_gate' }

    name: e2e-tests-local - ${{ matrix.shard.name }}

    steps:
      - name: Checkout retarget reporter
        if: inputs.retarget_run != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: retarget-ci
          sparse-checkout: .github/scripts
      - name: Report retarget tests running
        if: inputs.retarget_run != ''
        uses: actions/github-script@v9
        env:
          RETARGET_CHECK_RUN_ID: ${{ inputs.check_run_id }}
          RETARGET_RUN: ${{ inputs.retarget_run }}
          RETARGET_HEAD_SHA: ${{ inputs.head_sha }}
          RETARGET_MERGE_COMMIT: ${{ inputs.merge_commit }}
          RETARGET_PR: ${{ inputs.pr }}
          RETARGET_HELPER_REF: ${{ inputs.helper_ref }}
        with:
          script: |
            const {reportRetargetResult} = require('./retarget-ci/.github/scripts/retarget-tests.cjs');
            await reportRetargetResult({github, context, core, name: 'e2e-status', phase: 'start'});

      - name: Resolve E2E tests ref
        id: e2e-ref
        uses: synonymdev/bitkit-e2e-tests/.github/actions/resolve-e2e-ref@main
        with:
          selected: ${{ needs.e2e-branch.outputs.branch }}
          e2e_branch_input: ${{ github.event.inputs.e2e_branch || 'default-feature-branch' }}

      - name: Clone E2E tests
        uses: actions/checkout@v7
        with:
          repository: synonymdev/bitkit-e2e-tests
          path: bitkit-e2e-tests
          ref: ${{ steps.e2e-ref.outputs.ref }}

      - name: Download iOS app
        uses: actions/download-artifact@v8
        with:
          name: bitkit-e2e-ios_${{ github.run_number }}
          path: bitkit-e2e-tests/aut

      - name: List iOS app directory contents
        run: ls -l bitkit-e2e-tests/aut

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache npm cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('bitkit-e2e-tests/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: bitkit-e2e-tests
        run: npm ci

      - name: Docker info
        run: |
          docker --version
          docker info
          docker ps
          docker compose version

      - name: Run regtest setup
        working-directory: bitkit-e2e-tests
        run: |
          if [ -x ./scripts/local-backend ]; then
            ./scripts/local-backend prepare
            ./scripts/local-backend down --remove-orphans -v -t 300
            ./scripts/local-backend up
            ./scripts/local-backend github-env >> "$GITHUB_ENV"
          else
            # Older E2E refs still carry the bundled stack.
            cd docker
            docker compose --verbose --profile trezor down --remove-orphans -v -t 300 || true
            mkdir -p lnd && chmod 777 lnd
            docker compose --verbose up --force-recreate -d
          fi

      - name: Wait for electrum server
        run: |
          for _ in $(seq 1 60); do
            python3 -c 'import socket; s = socket.create_connection(("127.0.0.1", 60001), 10); s.sendall(b"{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"blockchain.headers.subscribe\",\"params\":[]}\n"); assert b"height" in s.recv(4096)' && exit 0
            sleep 5
          done
          exit 1

      - name: Clear previous E2E artifacts
        working-directory: bitkit-e2e-tests
        run: |
          rm -rf artifacts/
          rm -rf /tmp/lock/

      - name: Clear iOS Simulator environment
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl erase "iPhone 17" || true
          defaults write com.apple.iphonesimulator DisableAllNotifications -bool true

      - name: Run E2E Tests 1 (${{ matrix.shard.name }})
        continue-on-error: true
        id: test1
        working-directory: bitkit-e2e-tests
        run: ./ci_run_ios.sh --mochaOpts.grep '${{ matrix.shard.grep }}'
        env:
          RECORD_VIDEO: true
          ATTEMPT: 1

      - name: Run E2E Tests 2 (${{ matrix.shard.name }})
        continue-on-error: true
        if: steps.test1.outcome != 'success'
        id: test2
        working-directory: bitkit-e2e-tests
        run: ./ci_run_ios.sh --mochaOpts.grep "${{ matrix.shard.grep }}"
        env:
          RECORD_VIDEO: true
          ATTEMPT: 2

      - name: Run E2E Tests 3 (${{ matrix.shard.name }})
        if: steps.test1.outcome != 'success' && steps.test2.outcome != 'success'
        id: test3
        working-directory: bitkit-e2e-tests
        run: ./ci_run_ios.sh --mochaOpts.grep "${{ matrix.shard.grep }}"
        env:
          RECORD_VIDEO: true
          ATTEMPT: 3

      - name: Upload E2E Artifacts (${{ matrix.shard.name }})
        # Preserve failed-attempt evidence even when a retry passes.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts_${{ matrix.shard.name }}_${{ github.run_number }}
          path: bitkit-e2e-tests/artifacts/
          retention-days: 7

      - name: Cleanup Docker containers
        if: always()
        working-directory: bitkit-e2e-tests
        run: |
          if [ -x ./scripts/local-backend ]; then
            ./scripts/local-backend down --remove-orphans -v || true
          else
            (cd docker && docker compose --profile trezor down --remove-orphans -v) || true
          fi

  hosted-ubuntu:
    name: Hosted Ubuntu shard ${{ matrix.shard }}
    if: github.event_name == 'workflow_dispatch' && inputs.hosted_two_shard && !inputs.pr && !inputs.retarget_run
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      SHARD: ${{ matrix.shard }}
      IOS_GATE_SHARD: ${{ matrix.shard == 1 && 'payments' || 'channels' }}
      BITCOIN_FALLBACK_FEE: "0.00001"
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: synonymdev/bitkit-e2e-tests
          ref: ${{ env.PILOT_HARNESS_SHA }}
          path: bitkit-e2e-tests
          persist-credentials: false
      - name: Join CI network
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3, used in the original trial
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: bk-linux-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          args: --accept-dns=false
      - name: Authorize this runner pair
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: python3 .github/scripts/hosted-e2e-pair.py authorize
      - name: Serve the pinned regtest backend until its Mac finishes
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/hosted-e2e-backend.sh

  hosted-mac:
    name: Hosted iOS shard ${{ matrix.shard }}
    if: github.event_name == 'workflow_dispatch' && inputs.hosted_two_shard && !inputs.pr && !inputs.retarget_run
    runs-on: macos-26
    timeout-minutes: 155
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      SHARD: ${{ matrix.shard }}
      IOS_GATE_SHARD: ${{ matrix.shard == 1 && 'payments' || 'channels' }}
      BACKEND: local
      SIMULATOR_NAME: iPhone 17
      SIMULATOR_OS_VERSION: "26.5"
      # Keep wallet, input, camera, connectivity and diagnostic services available to the gate.
      SIMSLIM_KEEP_CATEGORIES: icloud,store,pim,web,photos,messaging,connectivity,telemetry,mdm,other
      WDA_LAUNCH_TIMEOUT: "600000"
      WDIO_CONNECTION_RETRY_TIMEOUT: "660000"
      RECORD_VIDEO: true
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: synonymdev/bitkit-e2e-tests
          ref: ${{ env.PILOT_HARNESS_SHA }}
          path: bitkit-e2e-tests
          persist-credentials: false
      - name: Join CI network
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: bk-mac-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          args: --accept-dns=false
      - name: Authorize this runner pair
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: python3 .github/scripts/hosted-e2e-pair.py authorize
      - name: Verify paired backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/hosted-e2e-mac.sh connect
      - name: Wait for both verified pairs
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/hosted-e2e-mac.sh barrier
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies and start the simulator
        working-directory: bitkit-e2e-tests
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | jq -er --arg name "$SIMULATOR_NAME" '.devices["com.apple.CoreSimulator.SimRuntime.iOS-26-5"][] | select(.name == $name) | .udid' | head -1)
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          npm ci
          command -v ffmpeg >/dev/null || brew install ffmpeg
          xcrun simctl bootstatus "$udid" -b
      - name: Apply SimSlim to the hosted simulator
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive=simslim-v0.15.0-macos-arm64.tar.gz
          curl -fsSL --retry 3 -o "$archive" "https://github.com/MobAI-App/simslim/releases/download/v0.15.0/$archive"
          echo "8db2d7b9c41f7cbc925c883a2907a2941e8b8bf8d6fc8cc4ce7343a830d61a31  $archive" | shasum -a 256 -c -
          tar -xzf "$archive" simslim
          ./simslim version
          evidence="$GITHUB_WORKSPACE/bitkit-e2e-tests/artifacts/simslim"
          mkdir -p "$evidence"
          ./simslim measure "$SIMULATOR_UDID" --json | tee "$evidence/stock.json"
          ./simslim on "$SIMULATOR_UDID" --except "$SIMSLIM_KEEP_CATEGORIES"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          open -a Simulator
          ./simslim measure "$SIMULATOR_UDID" --json | tee "$evidence/slim.json"
      - name: Wait for the shared app build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2400))
          while ((SECONDS < deadline)); do
            if status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" --jq '.jobs[] | select(.name == "build-local") | .conclusion // "running"'); then
              case "$status" in
                success) exit 0 ;;
                running|'') ;;
                *) echo "::error::Shared build concluded $status"; exit 1 ;;
              esac
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for the shared build"
          exit 1
      - uses: actions/download-artifact@v8
        with:
          name: bitkit-e2e-ios_${{ github.run_number }}
          path: bitkit-e2e-tests/aut
      - name: Verify the gate simulator and its SimSlim profile
        working-directory: bitkit-e2e-tests
        run: |
          set -euo pipefail
          # The harness selects a booted simulator by name. Ensure its only match is the slimmed device.
          xcrun simctl list devices booted -j | jq -e '[.devices[][] | select(.name == env.SIMULATOR_NAME and .state == "Booted") | .udid] == [env.SIMULATOR_UDID]'
          "$RUNNER_TEMP/simslim" verify "$SIMULATOR_UDID" --except "$SIMSLIM_KEEP_CATEGORIES" --json | tee artifacts/simslim/verified.json
      - name: Run gate cases on the paired backend
        working-directory: bitkit-e2e-tests
        run: bash ../.github/scripts/hosted-e2e-gate.sh
      - name: Shut down the private forwarders
        if: always()
        run: .github/scripts/hosted-e2e-mac.sh stop
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-ios-${{ matrix.shard }}-${{ github.run_attempt }}
          path: bitkit-e2e-tests/artifacts/
          if-no-files-found: ignore
          retention-days: 3

  e2e-status:
    if: always() && !inputs.hosted_two_shard && github.event.pull_request.draft == false
    name: e2e-status
    runs-on: ubuntu-24.04
    needs: [detect-changes, e2e-tests-local]
    steps:
      - name: Verify change detection succeeded
        if: needs.detect-changes.result != 'success'
        run: |
          echo "Change detection failed or did not complete."
          exit 1

      - name: E2E skipped - no code changes
        if: needs.detect-changes.outputs.code != 'true'
        run: echo "✅ E2E skipped - no code changes"

      - name: Verify all E2E shards succeeded
        if: needs.detect-changes.outputs.code == 'true'
        run: |
          if [ "${{ needs.e2e-tests-local.result }}" != "success" ]; then
            echo "❌ Some E2E shards failed."
            exit 1
          fi
          echo "✅ All E2E shards passed!"

  report-retarget-result:
    name: Report retarget E2E result
    if: always() && inputs.retarget_run != ''
    needs: [detect-changes, build-local, e2e-branch, e2e-tests-local, e2e-status]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: retarget-ci
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v9
        env:
          RETARGET_CHECK_RUN_ID: ${{ inputs.check_run_id }}
          RETARGET_RUN: ${{ inputs.retarget_run }}
          RETARGET_HEAD_SHA: ${{ inputs.head_sha }}
          RETARGET_MERGE_COMMIT: ${{ inputs.merge_commit }}
          RETARGET_PR: ${{ inputs.pr }}
          RETARGET_HELPER_REF: ${{ inputs.helper_ref }}
          TEST_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
