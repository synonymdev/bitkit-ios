name: Spark Mac diagnostics

on:
  workflow_dispatch:
    inputs:
      e2e_branch:
        description: Exact shared E2E ref
        type: string
        default: main

permissions:
  contents: read

jobs:
  docker-health:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 8
    steps:
      - name: Check disk space and Docker client
        run: |
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          uname -m
          docker --version
          docker context show

      - name: Check Docker server availability
        timeout-minutes: 2
        run: docker version --format '{{.Server.Version}}'

      - uses: actions/checkout@v7
        with:
          repository: synonymdev/bitkit-e2e-tests
          ref: ${{ inputs.e2e_branch }}
          path: bitkit-e2e-tests
          persist-credentials: false

      - name: Render the pinned Spark image list
        timeout-minutes: 2
        working-directory: bitkit-e2e-tests
        run: |
          ./scripts/local-backend prepare
          cd "$(./scripts/local-backend path)"
          docker compose --profile spark config --images

      - name: Read the pinned Spark image IDs
        timeout-minutes: 2
        working-directory: bitkit-e2e-tests
        run: ./scripts/local-backend spark-image-fingerprint
