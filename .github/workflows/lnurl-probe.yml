name: lnurl-probe

on:
  push:
    branches: [ci/lnurl-probe]

env:
  TERM: xterm-256color
  FORCE_COLOR: 1
  GIT_LFS_SKIP_SMUDGE: "1"
  SIMULATOR_NAME: "iPhone 17"

jobs:
  lnurl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fix-a, os: "26.2" }
          - { name: fix-b, os: "26.2" }
          - { name: fix-c, os: "26.2" }
          - { name: fix-d, os: "26.2" }
    name: lnurl ${{ matrix.name }}
    runs-on: namespace-profile-mac
    timeout-minutes: 60
    env:
      SIMULATOR_OS_VERSION: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Install iOS ${{ matrix.os }} runtime
        if: matrix.os != '26.2'
        run: |
          start=$(date +%s)
          xcodebuild -downloadPlatform iOS -buildVersion "$SIMULATOR_OS_VERSION"
          xcrun simctl list runtimes | grep iOS
          echo "runtime download took $(( $(date +%s) - start ))s"

      - name: Select simulator
        run: |
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-$(echo "$SIMULATOR_OS_VERSION" | cut -d. -f1-2 | tr . -)"
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtime, name = sys.argv[1], sys.argv[2]
          print(next((d["udid"] for d in json.load(sys.stdin)["devices"].get(runtime, []) if d["name"] == name), ""))
          ' "$runtime" "$SIMULATOR_NAME")
          [ -n "$udid" ] || udid=$(xcrun simctl create "$SIMULATOR_NAME" "$SIMULATOR_NAME" "$runtime")
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl shutdown all || true
          xcrun simctl erase "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          defaults write com.apple.iphonesimulator DisableAllNotifications -bool true
          xcrun simctl list devices | grep "$udid"

      - name: Build app
        run: |
          brew install xcbeautify
          xcodebuild -workspace Bitkit.xcodeproj/project.xcworkspace \
            -scheme Bitkit \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG E2E_BUILD' \
            TREZOR_BRIDGE=true \
            TREZOR_BRIDGE_URL=http://127.0.0.1:21325 \
            -allowProvisioningUpdates \
            build | xcbeautify

      - uses: actions/checkout@v7
        with:
          repository: synonymdev/bitkit-e2e-tests
          path: bitkit-e2e-tests
          ref: main

      - name: Stage app
        run: |
          mkdir -p bitkit-e2e-tests/aut
          cp -R DerivedData/Build/Products/Debug-iphonesimulator/Bitkit.app bitkit-e2e-tests/aut/Bitkit.app

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: bitkit-e2e-tests
        run: npm ci

      - name: Run regtest setup
        run: |
          .github/scripts/namespace-stack.sh up bitkit-e2e-tests/docker
          (cd bitkit-e2e-tests/docker && docker compose up --force-recreate -d)
          .github/scripts/namespace-stack.sh forward 43782 39388 60001 8080 9735 10009 3003 9001 9002 21325 21328

      - name: Wait for electrum server
        run: |
          for _ in $(seq 1 60); do
            python3 -c 'import socket; s = socket.create_connection(("127.0.0.1", 60001), 10); s.sendall(b"{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"blockchain.headers.subscribe\",\"params\":[]}\n"); assert b"height" in s.recv(4096)' && exit 0
            sleep 5
          done
          exit 1

      - name: Copy LND credentials
        working-directory: bitkit-e2e-tests/docker
        run: |
          mkdir -p lnd/data/chain/bitcoin/regtest
          for _ in $(seq 1 60); do
            docker cp lnd:/home/lnd/.lnd/data/chain/bitcoin/regtest/admin.macaroon lnd/data/chain/bitcoin/regtest/ 2>/dev/null && break
            sleep 5
          done
          docker cp lnd:/home/lnd/.lnd/tls.cert lnd/tls.cert
          test -s lnd/data/chain/bitcoin/regtest/admin.macaroon

      - name: Run @lnurl_1
        id: test
        working-directory: bitkit-e2e-tests
        run: ./ci_run_ios.sh --mochaOpts.grep "@lnurl_1"
        env:
          RECORD_VIDEO: true
          ATTEMPT: 1

      - name: Collect app logs
        if: always()
        run: |
          mkdir -p probe
          find ~/Library/Developer/CoreSimulator/Devices/"$SIMULATOR_UDID" -name "bitkit_*.log" -exec cp {} probe/ \; 2>/dev/null || true
          ls -la probe
          {
            echo "### ${{ matrix.name }}: @lnurl_1 ${{ steps.test.outcome }}"
            echo '```'
            cat probe/*.log 2>/dev/null | grep -E "PROBE|SheetViewModel|LNURL" | grep -vE "^\s+[0-9]+ " | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lnurl-probe-${{ matrix.name }}
          path: |
            probe/
            bitkit-e2e-tests/artifacts/

      - name: Tear down
        if: always()
        run: .github/scripts/namespace-stack.sh down
