name: unit-tests

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  GIT_LFS_SKIP_SMUDGE: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
    
  test:
    if: github.event.pull_request.draft == false
    name: Run Tests
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install xcbeautify
        run: |
          brew install xcbeautify

      - name: Swift packages
        uses: ./.github/actions/swift-packages

      - name: Pre-start simulator
        run: |
          echo "⏱️  Starting simulator at $(date)"
          xcrun simctl boot "iPhone 17" || true
          echo "✅ Simulator started at $(date)"

      - name: Run unit tests
        # Leaves time for the upload below when a slow runner's build ate most of the job's hour
        timeout-minutes: 55
        run: |
          echo "⏱️  Starting unit tests at $(date)"
          set -o pipefail && xcodebuild test \
            -scheme Bitkit \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -disablePackageRepositoryCache \
            -disableAutomaticPackageResolution \
            -skipPackageUpdates \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            -skip-testing:BitkitTests/UtxoSelectionTests \
            -skip-testing:BitkitTests/AddressTypeIntegrationTests \
            -skip-testing:BitkitTests/RNMigrationCleanupTests \
            | xcbeautify --report junit
          echo "✅ Unit tests completed at $(date)"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
