name: integration-tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  GIT_LFS_SKIP_SMUDGE: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    if: github.event.pull_request.draft == false
    name: Run Integration Tests
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=latest
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
      SOURCE_PACKAGES: ${{ github.workspace }}/SourcePackages
      RESULT_BUNDLE: ${{ github.workspace }}/IntegrationTests.xcresult

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install xcbeautify
        run: |
          brew install xcbeautify

      # SwiftPM keeps full bare clones in SourcePackages/repositories (bitkit-core's history alone
      # is over 10 GB, past the repository cache limit). Checkouts and binary artifacts are all a
      # build needs, so only those are cached.
      - name: Restore Swift packages
        id: spm-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.SOURCE_PACKAGES }}/checkouts
            ${{ env.SOURCE_PACKAGES }}/artifacts
            ${{ env.SOURCE_PACKAGES }}/workspace-state.json
          key: ${{ runner.os }}-source-packages-${{ hashFiles('Bitkit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve Swift packages
        run: |
          echo "⏱️  Starting dependency resolution at $(date)"
          set -o pipefail && xcodebuild -resolvePackageDependencies \
            -scheme Bitkit \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -disablePackageRepositoryCache \
            -onlyUsePackageVersionsFromResolvedFile \
            | xcbeautify
          echo "✅ Dependencies resolved at $(date)"

      # Saved right after resolving so a failing test run still warms the cache.
      - name: Save Swift packages
        if: steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.SOURCE_PACKAGES }}/checkouts
            ${{ env.SOURCE_PACKAGES }}/artifacts
            ${{ env.SOURCE_PACKAGES }}/workspace-state.json
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      - name: Build for testing
        run: |
          echo "⏱️  Starting build at $(date)"
          set -o pipefail && xcodebuild build-for-testing \
            -scheme Bitkit \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -disableAutomaticPackageResolution \
            -enableCodeCoverage NO \
            | xcbeautify
          echo "✅ Build finished at $(date)"

      - name: Run integration tests
        timeout-minutes: 20
        run: |
          echo "⏱️  Starting integration tests at $(date)"

          # RNMigrationCleanupTests deletes the real ~/Documents/mmkv and ~/Documents/ldk, so it
          # skips itself unless this is set. This lane runs on a throwaway CI simulator; the unit
          # lane does not, and must not run it.
          #
          # The TEST_RUNNER_ prefix is required: xcodebuild does not pass the invoking shell's
          # environment to the simulator-hosted runner, only variables named TEST_RUNNER_<VAR>,
          # which it forwards with the prefix stripped. Without it the guard never sees the
          # variable, every test in the suite skips, and the lane still reports green.
          #
          # The live regtest suites are flaky on CI runners, so a failed test is retried once on
          # its own instead of rebuilding and rerunning the whole suite.
          set -o pipefail && TEST_RUNNER_BITKIT_DESTRUCTIVE_TESTS=1 xcodebuild test-without-building \
            -scheme Bitkit \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -only-testing:BitkitTests/UtxoSelectionTests \
            -only-testing:BitkitTests/BlocktankTests \
            -only-testing:BitkitTests/PaymentFlowTests \
            -only-testing:BitkitTests/BlocktankRefundAddressLiveIntegrationTests \
            -only-testing:BitkitTests/AddressTypeIntegrationTests \
            -only-testing:BitkitTests/RNMigrationCleanupTests \
            | xcbeautify --report junit
          echo "✅ Integration tests completed at $(date)"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: integration-test-results
          path: ${{ env.RESULT_BUNDLE }}
