name: integration-tests
run-name: Authenticated Blocktank integration pilot

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  GIT_LFS_SKIP_SMUDGE: "1"

concurrency:
  group: stag0-hosted-integration-pilot
  cancel-in-progress: false

jobs:
  test:
    name: Run Integration Tests
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
      RESULT_BUNDLE: ${{ github.workspace }}/IntegrationTests.xcresult

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      # A fresh simulator takes over 10 minutes to boot on the runner. Booting it now lets that
      # overlap with resolving and building instead of stalling the test step.
      - name: Boot simulator
        env:
          SIMULATOR_NAME: "iPhone 17"
          SIMULATOR_OS: "26.5"
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-" + os.environ["SIMULATOR_OS"].replace(".", "-")
          devices = json.load(sys.stdin)["devices"].get(runtime, [])
          print(next(d["udid"] for d in devices if d["name"] == os.environ["SIMULATOR_NAME"]))
          ')
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          echo "DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"

      - name: Install xcbeautify
        run: |
          brew install xcbeautify

      - name: Swift packages
        uses: ./.github/actions/swift-packages

      - name: Build for testing
        run: |
          echo "⏱️  Starting build at $(date)"
          set -o pipefail && xcodebuild build-for-testing \
            -scheme Bitkit \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -disablePackageRepositoryCache \
            -disableAutomaticPackageResolution \
            -skipPackageUpdates \
            -enableCodeCoverage NO \
            | xcbeautify
          echo "✅ Build finished at $(date)"

      - name: Run integration tests
        id: xctest
        timeout-minutes: 25
        env:
          TEST_RUNNER_BLOCKTANK_REGTEST_AUTH: ${{ secrets.BLOCKTANK_REGTEST_AUTH }}
          TEST_RUNNER_INTEGRATION_REGTEST_API_URL: ${{ vars.INTEGRATION_REGTEST_API_URL }}
          TEST_RUNNER_INTEGRATION_REGTEST_ELECTRUM_URL: ${{ vars.INTEGRATION_REGTEST_ELECTRUM_URL }}
          INTEGRATION_REGTEST_AUTH: ${{ secrets.INTEGRATION_REGTEST_AUTH }}
          TEST_RUNNER_BITKIT_DESTRUCTIVE_TESTS: "1"
          TEST_RUNNER_E2E: "false"
        run: |
          if [[ -n "$TEST_RUNNER_INTEGRATION_REGTEST_API_URL" || -n "$TEST_RUNNER_INTEGRATION_REGTEST_ELECTRUM_URL" ]]; then
            if [[ -z "$TEST_RUNNER_INTEGRATION_REGTEST_API_URL" || -z "$TEST_RUNNER_INTEGRATION_REGTEST_ELECTRUM_URL" ]]; then
              echo "::error::Configure the integration regtest API and Electrum URLs together"
              exit 1
            fi
            export TEST_RUNNER_BLOCKTANK_REGTEST_AUTH="$INTEGRATION_REGTEST_AUTH"
          fi
          if [[ -z "$TEST_RUNNER_BLOCKTANK_REGTEST_AUTH" ]]; then
            echo "::error::The selected regtest backend is missing its CI auth secret"
            exit 1
          fi

          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          set -o pipefail
          xcodebuild test-without-building \
            -scheme Bitkit \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -disablePackageRepositoryCache \
            -disableAutomaticPackageResolution \
            -skipPackageUpdates \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 600 \
            -maximum-test-execution-time-allowance 600 \
            -only-testing:BitkitTests/UtxoSelectionTests \
            -only-testing:BitkitTests/AddressTypeIntegrationTests \
            -only-testing:BitkitTests/RNMigrationCleanupTests \
            | xcbeautify --report junit

      - name: Verify all 28 test results
        if: always() && steps.xctest.outcome != 'skipped'
        run: |
          xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" > "$RUNNER_TEMP/integration-summary.json"
          python3 - "$RUNNER_TEMP/integration-summary.json" <<'PYTHON'
          import json
          import sys

          with open(sys.argv[1]) as report:
              summary = json.load(report)

          total = summary["totalTestCount"]
          passed = summary["passedTests"]
          failed = summary["failedTests"]
          skipped = summary["skippedTests"]
          print(f"XCTest results: {passed} passed, {failed} failed, {skipped} skipped, {total} total.")
          if (total, passed, failed, skipped) != (28, 28, 0, 0):
              raise SystemExit("Expected 28 passing tests with no failures or skips.")
          PYTHON
