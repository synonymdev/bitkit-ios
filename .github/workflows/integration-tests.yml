name: integration-tests
run-name: >-
  ${{ inputs.retarget_run && format('Retarget integration for PR #{0}', inputs.pr) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to test as merged into master"
        default: ""
      merge_commit:
        description: "Pinned PR merge commit for retarget validation"
        default: ""
      head_sha:
        description: "PR head verified by the retarget dispatcher"
        default: ""
      check_run_id:
        description: "PR check owned by this retarget validation"
        default: ""
      retarget_run:
        description: "Retarget status owner (set by e2e-retarget.yml)"
        default: ""
      workflow_ref:
        description: "Workflow source recorded for this validation generation"
        default: master
      helper_ref:
        description: "Recovery helper branch or tag"
        default: master

env:
  GIT_LFS_SKIP_SMUDGE: "1"

concurrency:
  group: integration-tests-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

jobs:

  regtest:
    name: Select integration backend
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.select.outputs.backend }}
    steps:
      - name: Check whether staging credentials can be used
        id: select
        uses: actions/github-script@v9
        env:
          DISPATCH_PR: ${{ inputs.pr }}
          DISPATCH_MERGE_COMMIT: ${{ inputs.merge_commit }}
        with:
          script: |
            let pr = context.payload.pull_request;
            if (!pr && process.env.DISPATCH_PR) {
              const { data } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: Number(process.env.DISPATCH_PR),
              });
              pr = data;
            }

            const repository = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            if (pr && pr.head.repo?.full_name?.toLowerCase() !== repository) {
              core.setOutput('backend', 'local');
              return;
            }

            // Retarget recovery can test a snapshot from before staging mode existed.
            const ref = process.env.DISPATCH_MERGE_COMMIT
              || (process.env.DISPATCH_PR ? `refs/pull/${process.env.DISPATCH_PR}/merge` : '');
            if (ref) {
              const { data } = await github.rest.repos.getContent({
                ...context.repo,
                path: 'BitkitTests/LocalRegtest.swift',
                ref,
              });
              const source = Buffer.from(data.content, 'base64').toString('utf8');
              if (!source.includes('INTEGRATION_REGTEST_BACKEND')) {
                core.setOutput('backend', 'local');
                return;
              }
            }
            core.setOutput('backend', 'staging');

  test:
    # PR code must not publish dependency caches into the dispatch ref's scope.
    cache-mode: read
    if: github.event.pull_request.draft == false
    name: Run Integration Tests
    needs: [regtest]
    # Forks use the isolated stack because GitHub withholds staging credentials from fork PRs.
    runs-on: ${{ needs.regtest.outputs.backend == 'local' && 'namespace-profile-mac' || 'macos-26' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      pull-requests: read
      checks: write
      actions: write
    env:
      REGTEST_BACKEND: ${{ needs.regtest.outputs.backend }}
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
      RESULT_BUNDLE: ${{ github.workspace }}/IntegrationTests.xcresult

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.merge_commit || (inputs.pr && format('refs/pull/{0}/merge', inputs.pr)) || '' }}
          persist-credentials: false

      - name: Checkout retarget reporter
        if: inputs.retarget_run != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: retarget-ci
          sparse-checkout: .github/scripts
      - name: Report retarget tests running
        if: inputs.retarget_run != ''
        uses: actions/github-script@v9
        env:
          RETARGET_CHECK_RUN_ID: ${{ inputs.check_run_id }}
          RETARGET_RUN: ${{ inputs.retarget_run }}
          RETARGET_HEAD_SHA: ${{ inputs.head_sha }}
          RETARGET_MERGE_COMMIT: ${{ inputs.merge_commit }}
          RETARGET_PR: ${{ inputs.pr }}
          RETARGET_HELPER_REF: ${{ inputs.helper_ref }}
        with:
          script: |
            const {reportRetargetResult} = require('./retarget-ci/.github/scripts/retarget-tests.cjs');
            await reportRetargetResult({github, context, core, name: 'Run Integration Tests', phase: 'start'});

      - name: Checkout bitkit-docker
        if: env.REGTEST_BACKEND == 'local'
        uses: actions/checkout@v7
        with:
          repository: synonymdev/bitkit-docker
          ref: main
          path: bitkit-docker

      - name: Start local regtest
        if: env.REGTEST_BACKEND == 'local'
        run: |
          .github/scripts/namespace-stack.sh up bitkit-docker
          .github/scripts/namespace-stack.sh forward 43782 60001
          (cd bitkit-docker && docker compose up -d bitcoind bitcoinsetup electrs)

      # A separate step: `namespace-stack.sh up` puts its `docker exec` wrapper on the PATH for later steps only.
      - name: Mine initial blocks
        if: env.REGTEST_BACKEND == 'local'
        timeout-minutes: 5
        run: until docker exec bitcoin bitcoin-cli -regtest -rpcport=43782 -rpcuser=polaruser -rpcpassword=polarpass -generate 101; do sleep 2; done

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      # A fresh simulator takes over 10 minutes to boot on the runner. Booting it now lets that
      # overlap with resolving and building instead of stalling the test step.
      - name: Boot simulator
        env:
          SIMULATOR_NAME: "iPhone 17"
          SIMULATOR_OS: "26.5"
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-" + os.environ["SIMULATOR_OS"].replace(".", "-")
          devices = json.load(sys.stdin)["devices"].get(runtime, [])
          print(next(d["udid"] for d in devices if d["name"] == os.environ["SIMULATOR_NAME"]))
          ')
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          echo "DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"

      - name: Install xcbeautify
        run: |
          brew install xcbeautify

      - name: Swift packages
        uses: ./.github/actions/swift-packages

      - name: Build for testing
        run: |
          echo "⏱️  Starting build at $(date)"
          set -o pipefail && xcodebuild build-for-testing \
            -scheme Bitkit \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -disablePackageRepositoryCache \
            -disableAutomaticPackageResolution \
            -skipPackageUpdates \
            -enableCodeCoverage NO \
            | xcbeautify
          echo "✅ Build finished at $(date)"

      - name: Wait for electrum server
        if: env.REGTEST_BACKEND == 'local'
        run: |
          for _ in $(seq 1 60); do
            python3 -c 'import socket; s = socket.create_connection(("127.0.0.1", 60001), 10); s.sendall(b"{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"blockchain.headers.subscribe\",\"params\":[]}\n"); assert b"height" in s.recv(4096)' && exit 0
            sleep 5
          done
          exit 1

      - name: Run integration tests
        id: xctest
        timeout-minutes: 25
        env:
          BLOCKTANK_REGTEST_AUTH: ${{ needs.regtest.outputs.backend == 'staging' && secrets.BLOCKTANK_REGTEST_AUTH || '' }}
          INTEGRATION_REGTEST_AUTH: ${{ needs.regtest.outputs.backend == 'staging' && secrets.INTEGRATION_REGTEST_AUTH || '' }}
          INTEGRATION_REGTEST_API_URL: ${{ vars.INTEGRATION_REGTEST_API_URL }}
          INTEGRATION_REGTEST_ELECTRUM_URL: ${{ vars.INTEGRATION_REGTEST_ELECTRUM_URL }}
        run: |
          # xcodebuild forwards TEST_RUNNER_* variables to XCTest without the prefix.
          # Only this integration job enables the destructive migration tests.
          export TEST_RUNNER_BITKIT_DESTRUCTIVE_TESTS=1
          if [[ "$REGTEST_BACKEND" == local ]]; then
            export TEST_RUNNER_E2E=true
          else
            export TEST_RUNNER_E2E=false
            export TEST_RUNNER_INTEGRATION_REGTEST_BACKEND=staging

            if [[ -n "$INTEGRATION_REGTEST_API_URL" || -n "$INTEGRATION_REGTEST_ELECTRUM_URL" ]]; then
              if [[ -z "$INTEGRATION_REGTEST_API_URL" || -z "$INTEGRATION_REGTEST_ELECTRUM_URL" ]]; then
                echo "::error::Configure the integration regtest API and Electrum URLs together"
                exit 1
              fi
              export TEST_RUNNER_INTEGRATION_REGTEST_API_URL="$INTEGRATION_REGTEST_API_URL"
              export TEST_RUNNER_INTEGRATION_REGTEST_ELECTRUM_URL="$INTEGRATION_REGTEST_ELECTRUM_URL"
              export TEST_RUNNER_BLOCKTANK_REGTEST_AUTH="$INTEGRATION_REGTEST_AUTH"
            else
              export TEST_RUNNER_BLOCKTANK_REGTEST_AUTH="$BLOCKTANK_REGTEST_AUTH"
            fi

            if [[ -z "$TEST_RUNNER_BLOCKTANK_REGTEST_AUTH" ]]; then
              echo "::error::The selected integration backend is missing its CI auth secret"
              exit 1
            fi
          fi

          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          set -o pipefail
          xcodebuild test-without-building \
            -scheme Bitkit \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -disablePackageRepositoryCache \
            -disableAutomaticPackageResolution \
            -skipPackageUpdates \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 600 \
            -maximum-test-execution-time-allowance 600 \
            -only-testing:BitkitTests/UtxoSelectionTests \
            -only-testing:BitkitTests/AddressTypeIntegrationTests \
            -only-testing:BitkitTests/RNMigrationCleanupTests \
            | xcbeautify --report junit
          echo "✅ Integration tests completed at $(date)"

      - name: Summarize staging integration results
        id: summary
        if: always() && env.REGTEST_BACKEND == 'staging' && (steps.xctest.outcome == 'success' || steps.xctest.outcome == 'failure')
        run: |
          # Publish counts without the XCTest archive, which may contain process diagnostics.
          if [[ ! -d "$RESULT_BUNDLE" ]]; then
            echo "No XCTest result bundle was produced."
            exit 0
          fi
          set -o pipefail
          xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" | python3 -c '
          import json
          import sys

          summary = json.load(sys.stdin)
          fields = ("totalTestCount", "passedTests", "failedTests", "skippedTests", "expectedFailures")
          print(json.dumps({field: summary[field] for field in fields}, indent=2))
          ' | tee "$RUNNER_TEMP/integration-test-summary.json"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Upload staging integration summary
        uses: actions/upload-artifact@v7
        if: always() && steps.summary.outputs.created == 'true'
        with:
          name: integration-test-results
          path: ${{ runner.temp }}/integration-test-summary.json

      - name: Upload local integration results
        uses: actions/upload-artifact@v7
        if: (success() || failure()) && env.REGTEST_BACKEND == 'local'
        with:
          name: integration-test-results
          path: ${{ env.RESULT_BUNDLE }}

      - name: Tear down regtest stack
        if: always() && env.REGTEST_BACKEND == 'local'
        run: .github/scripts/namespace-stack.sh down

  report-retarget-result:
    name: Report retarget integration result
    if: always() && inputs.retarget_run != ''
    needs: [test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: retarget-ci
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v9
        env:
          RETARGET_CHECK_RUN_ID: ${{ inputs.check_run_id }}
          RETARGET_RUN: ${{ inputs.retarget_run }}
          RETARGET_HEAD_SHA: ${{ inputs.head_sha }}
          RETARGET_MERGE_COMMIT: ${{ inputs.merge_commit }}
          RETARGET_PR: ${{ inputs.pr }}
          RETARGET_HELPER_REF: ${{ inputs.helper_ref }}
          TEST_RESULT: ${{ needs.test.result }}
        with:
          script: |
            const {reportRetargetResult} = require('./retarget-ci/.github/scripts/retarget-tests.cjs');
            await reportRetargetResult({github, context, core, name: 'Run Integration Tests', phase: 'complete', result: process.env.TEST_RESULT});
