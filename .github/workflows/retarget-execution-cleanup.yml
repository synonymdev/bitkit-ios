name: Clean up retarget execution refs

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: retarget-execution-cleanup
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const {cleanupExecutionRefs} = require('./.github/scripts/retarget-execution.cjs');
            await cleanupExecutionRefs({github, context, core});
